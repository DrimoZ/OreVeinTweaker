plugins {
    id 'java-library'
    // ModDevGradle's legacy-Forge plugin rather than ForgeGradle: same DSL as the NeoForge branches,
    // so the build files of the three branches stay comparable.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

// 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-1.20.1')
        }
        server {
            server()
            gameDirectory = project.file('run-1.20.1')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Legacy Forge runs on SRG names: without the refmap the mixin finds its target in dev and misses it
// in a player's game.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// Both licences travel with the jar: a distributed artifact that does not carry its own terms
// leaves a pack author guessing.
tasks.named('jar', Jar) {
    // Forge 1.20.1 finds mixin configs through the manifest only; MDG's mixin block sets the dev run
    // arguments, not this. Without it the mixin works in dev and silently never loads for players.
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
